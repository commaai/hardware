[project]
name = "comma-ultimate-provisioning"
version = "1.0"
description = "Interface for the comma ultimate provisioning (UP) board"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ultimate_provisioning = "ultimate_provisioning.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ultimate_provisioning"]
